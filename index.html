<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather Dashboard</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="container">
    <header><span class="eyebrow">LIVE WEATHER • OPEN-METEO</span><h1>Weather Dashboard</h1><p>Search for a city to see its current weather.</p></header>
    <form id="weatherForm" class="search" novalidate>
      <label for="cityInput" class="sr-only">City name</label>
      <input id="cityInput" type="text" placeholder="Enter a city (e.g. Beirut)" autocomplete="off" maxlength="100" required>
      <button id="searchButton" type="submit">Search</button>
    </form>
    <p id="loading" class="status" role="status" hidden><span class="spinner"></span> Loading weather data...</p>
    <p id="error" class="error" role="alert" hidden></p>
    <section id="weatherCard" class="weather-card" aria-live="polite" hidden>
      <div class="weather-heading"><div><p class="eyebrow">CURRENT CONDITIONS</p><h2 id="cityName"></h2><p id="updatedAt"></p></div><span id="weatherIcon" class="weather-icon" aria-hidden="true"></span></div>
      <div class="main-weather"><strong id="temperature"></strong><div><h3 id="description"></h3><p id="feelsLike"></p></div></div>
      <div class="details">
        <div><span>💧 Humidity</span><strong id="humidity"></strong></div>
        <div><span>💨 Wind speed</span><strong id="wind"></strong></div>
        <div><span>🌧️ Precipitation</span><strong id="precipitation"></strong></div>
        <div><span>🌡️ Today's high / low</span><strong id="highLow"></strong></div>
      </div>
    </section>
    <p class="footer">Weather data from <a href="https://open-meteo.com/" target="_blank" rel="noopener noreferrer">Open-Meteo</a>. No API key required.</p>
  </main>
</body>
</html>
